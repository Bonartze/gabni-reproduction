abstract: "This article reports a clean-room reimplementation of GABNI, a two-stage Boolean network inference method combining mutual information-based Boolean network inference (MIBNI) with a genetic algorithm (GA). The accompanying Python package implements data loading, optional binarization, MIBNI candidate selection, GA-based regulator search, Boolean transition prediction, edge sign assignment, and structural/dynamical evaluation. On the yeast cell-cycle benchmark distributed with the repository, the reimplementation reproduces perfect one-step dynamics accuracy and obtains a sparse inferred network with TP=15, FP=2, and FN=14 under the directed unsigned structural protocol. These structural counts differ from the original paper's reported yeast result, which we attribute mainly to short time-series under-determination, parsimony pressure in the reimplementation, and missing low-level details of the original implementation. The submission therefore supports the main dynamical claim while documenting the limits of exact structural replication. We provide a clean-room reimplementation of GABNI and reproduce selected results from Barman and Kwon (2018)."

